{{ define "content" }}
<section>
	<article style="max-width: 420px; margin-inline: auto;">
		<form action="/login" method="POST">
			<label for="email">Email</label>
			<input style="max-height: 50px;" type="email" id="email" name="email" required>

			<label for="password">Password</label>
			<input style="max-height: 50px;" type="password" id="password" name="password" required>

			<button type="submit">Login</button>
		</form>
	</article>
</section>
{{ end }}
