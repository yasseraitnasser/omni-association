{{ define "content" }}
<section>
	<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
		<h2>Projects</h2>
	</div>

	<details style="margin-bottom: 2rem;">
		<summary role="button" class="outline">Create a New Project +</summary>
		<article>
			<form action="/api/projects" method="POST">
				<div class="grid">
					<div>
						<label for="project_name">Project Name</label>
						<input type="text" id="project_name" name="project_name" required
							placeholder="e.g., Community Solar Initiative">
					</div>
					<div>
						<label for="budget">Initial Budget (MAD)</label>
						<input type="number" id="budget" name="budget" value="0" required>
					</div>
					<div>
						<label for="leader_id">Project Leader ID</label>
						<input type="number" id="leader_id" name="leader_id" value="0" required>
					</div>
				</div>

				<label for="description">Description</label>
				<textarea id="description" name="description" rows="3" required
					placeholder="Describe the objectives and scope..."></textarea>

				<button type="submit">Save & Create Project</button>
			</form>
		</article>
	</details>

	<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;">
		{{ range .Projects }}
		<article>
			<header>
				<div style="display: flex; justify-content: space-between; align-items: center;">
					<strong>{{ .Name }}</strong>
					<small><mark>{{ .Status }}</mark></small>
				</div>
			</header>

			<p
				style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 4.5em;">
				{{ .Description }}
			</p>

			<footer>
				<div style="display: flex; justify-content: space-between; align-items: center;">
					<small><strong>Budget:</strong> {{ .Budget }} MAD</small>
					<a href="/projects/{{ .ID }}" role="button" class="secondary"
						style="padding: 0.2rem 0.6rem; font-size: 0.8rem;">Details &rarr;</a>
				</div>
			</footer>
		</article>
		{{ else }} <!-- TODO: test having no projects -->
		<article style="grid-column: span 3;">
			<p style="text-align: center; margin: 0;"><em>No projects registered yet. Use the button above
					to create one!></em></p>
		</article>
		{{ end }}
	</div>
</section>
{{ end }}
